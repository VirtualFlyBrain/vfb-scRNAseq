# Brunet Avalos et al. 2019 (eLife; FBrf0244302): 10x scRNA-seq of first-instar larval
# brains (ventral nerve cord removed), wild-type Canton S, fed and 4 h starved (GEO
# GSE134722). Previously loaded into VFB via the old FlyBase/SCEA mechanism as FBlc0005362
# (scRNAseq_2019_Avalos: fed only, 10 types merged from SCEA labels); rebuilt here with
# fresh VFBseq ids. Curator decisions 2026-10-19: the paper's atlas, the fed cells only
# (the starved samples and the combined fed + starved analysis left out): the authors'
# 29 clusters, with per-cell assignments from the authors' UCSC Cell Browser dataset
# (dros-brain/normal; all 29 cluster sizes equal Figure 1-source data 1).
project: avalos_2019

source:
  doi: 10.7554/eLife.50354
  pmid: "31746739"
  pmcid: PMC6894929
  fbrf: FBrf0244302
  title: "Single cell transcriptome atlas of the Drosophila larval brain"
  journal: eLife
  year: 2019
  first_author: Brunet Avalos

organism: Drosophila melanogaster

dataset:
  site: GEO
  accession: GSE134722
  bioproject: PRJNA556226
  sra_study: SRP216038
  platform: GPL25244            # Illumina NovaSeq 6000
  licence: CC-BY-4.0
  assay_type: FBcv:0009000      # single-cell RNA-seq

sample_build:
  # Fed only (curator 2026-10-19): titles "First instar larval brain cells, Normal condition
  # (scRNAseq) <n> - sample <m>"; the Starvation condition GSMs do not match and are out of
  # scope. Each GSM is one 10x library. Supplementary file 1: the fed experiments are
  # Normal A (GSM3964166), Normal B (two libraries, B.1 GSM3964167 and B.2 GSM3964168) and
  # Normal C (GSM4132287), so 3 Samples, B with 2 Assays (sample_groups). B.1 and B.2 share
  # 577 cell barcodes in the authors' atlas (far above chance), so they appear to be two
  # libraries of the same captured cells; the authors' clusters are kept as published.
  title_pattern: 'regex:First instar larval brain cells, (?P<set>Normal) condition \(scRNAseq\) (?P<biorep>\d) - (?P<timepoint>sample) \d'
  assay_method: { fbcv_id: FBcv:0009008, label: 10x sequencing }
  assay_label: { unit: 10x library }
  # Two GSMs record the stage as "development stage" (sic), so the age is also given here.
  age: First instar larval
  age_map:
    "First instar larval":
      stage:  { fbdv_id: FBdv:00005337, label: first instar larval stage }
      tissue: { fbbt_id: FBbt:00001920, label: larval brain }    # the VNC was removed
  sex: mixed                     # larvae, not sexed
  sample_groups: { Normal_sample_3: Normal_sample_2 }
  # Canton S wild type (GEO "Wild type CS"; methods); no source stock named, so not linked.
  clusterings:
    - { id: fed, name: "Brunet Avalos 2019 larval brain clusters (fed)", sample_age: "First instar larval" }

# Clusters (projects/avalos_2019/build_clusters.py): the authors' 29 clusters from their UCSC
# Cell Browser dataset, typed by the cluster name without its number. None left untyped by
# the authors.
annotations:
  review_columns: [clustering, source_cluster_id, type]

unidentified:
  rule: none

# FBbt mappings are made once per author type (type_mapping/, write_type_mappings.py) and
# copied per cluster by scripts/expand_type_mappings.py.

# Summary expression (scripts/build_expression.py) from GEO's aggregated fed matrix
# (GSE134722_FirstInstarLarvalBrainNormalCondition_finalaggr_10X: Cell Ranger aggr of the
# four fed libraries, 4,708 cells, raw UMI counts, FBgn ids; cells <barcode>-<n> as in the
# authors' Cell Browser), cells assigned by the memberships (build_clusters.py).
expression:
  matrix_file: avalos/geo/matrix.mtx.gz
  features_file: avalos/geo/features.tsv.gz
  barcodes_file: avalos/geo/barcodes.tsv.gz
  membership_file: avalos/memberships.tsv.gz
  normalisation: CPM
  extent_cutoff: 0.2
  hide_in_terminfo: "true"
  gzip_tsv: true
  gene_id_map: gene_id_map.tsv
