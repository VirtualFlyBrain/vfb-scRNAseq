# Calderon et al. 2022 (Science; FBrf0254247): sci-RNA-seq3 of nuclei from wild-type
# (Canton S) embryos collected in 11 overlapping windows spanning 0-20 h at 25 C (GEO
# GSE190147, the RNA SubSeries of GSE190149; the sci-ATAC-seq SubSeries GSE190130 is not
# loaded). Previously loaded into VFB via the old FlyBase mechanism as FBlc0007797
# (scRNAseq_2022_Calderon: 274 clusters merged by type, per collection window and over all
# windows); rebuilt here with fresh VFBseq ids. Curator decisions 2026-10-18:
#   - the paper's main clustering: nuclei binned by the authors' neural-network age
#     estimate (NNv1) into non-overlapping 2-hour windows, each clustered and annotated
#     by hand (Table S1, table_s1_withLineage.xlsx on the authors' portal); the 18-20 h
#     window left out, as in the paper (model edge effects): 9 Clusterings, 268 clusters;
#   - plus the authors' neuronal re-clusterings: 20 sub-clusters of the 6-18 h
#     neuroectoderm and 11 sub-sub-clusters of its mature neurons (portal, 2023);
#   - Cluster stage from the modelled window (the nuclei's ages come from their own
#     transcriptomes), where an FBdv term narrower than embryonic stage covers it;
#   - "ubiquitous", "maternal" and "unknown" clusters held (untyped).
project: calderon_2022

source:
  doi: 10.1126/science.abn5800
  pmid: "35926038"
  pmcid: PMC9371440
  fbrf: FBrf0254247
  title: "The continuum of Drosophila embryonic development at single-cell resolution"
  journal: Science
  year: 2022
  first_author: Calderon

organism: Drosophila melanogaster

dataset:
  site: GEO
  accession: GSE190147
  superseries: GSE190149
  bioproject: PRJNA785986
  platform: GPL19132
  licence: CC-BY-4.0
  assay_type: FBcv:0009001      # single-nucleus RNA-Seq (sci-RNA-seq3 profiles nuclei)

sample_build:
  # projects/calderon_2022/build_samples.py. The 1,908 GSMs are sci-RNA-seq3 PCR wells, each
  # pooling nuclei of several collection windows (the RT barcode gives each nucleus's
  # window; GEO per-cell metadata `time`). Supplementary methods: each window's embryos
  # were collected, frozen and their nuclei isolated as a batch, and the sci-RNA-seq
  # experiments (exp1-exp12) each drew on several windows' nuclei. So one Sample per
  # collection window (11), one Assay per experiment x window (the nuclei of that window
  # in that experiment).
  assay_method: { fbcv_id: FBcv:0009056, label: single-cell combinatorial indexing RNA sequencing }
  assay_label: { unit: sci-RNA-seq3 experiment }
  # Canton S wild type (supplementary methods); no source stock named, so not linked.
  genotype: Canton S
  tissue: { fbbt_id: FBbt:00000052, label: embryo }
  # collection window -> the narrowest FBdv term covering its stages (Campos-Ortega &
  # Hartenstein timings at 25 C, from the FBdv definitions)
  windows:
    hrs_00_02: { hours: "0-2 h", stage: { fbdv_id: FBdv:00000054, label: cleavage stage } }                 # stages 1-4
    hrs_01_03: { hours: "1-3 h", stage: { fbdv_id: FBdv:00005289, label: embryonic stage } }                # 2-6
    hrs_02_04: { hours: "2-4 h", stage: { fbdv_id: FBdv:00005289, label: embryonic stage } }                # 4-9
    hrs_03_07: { hours: "3-7 h", stage: { fbdv_id: FBdv:00005289, label: embryonic stage } }                # 7-11
    hrs_04_08: { hours: "4-8 h", stage: { fbdv_id: FBdv:00005321, label: extended germ band stage } }       # 9-12
    hrs_06_10: { hours: "6-10 h", stage: { fbdv_id: FBdv:00005289, label: embryonic stage } }               # 11-13
    hrs_08_12: { hours: "8-12 h", stage: { fbdv_id: FBdv:00005289, label: embryonic stage } }               # 12-15
    hrs_10_14: { hours: "10-14 h", stage: { fbdv_id: FBdv:00005289, label: embryonic stage } }              # 13-16
    hrs_12_16: { hours: "12-16 h", stage: { fbdv_id: FBdv:00005289, label: embryonic stage } }              # 15-16
    hrs_14_18: { hours: "14-18 h", stage: { fbdv_id: FBdv:00005333, label: late embryonic stage } }         # 16-17
    hrs_16_20: { hours: "16-20 h", stage: { fbdv_id: FBdv:00005335, label: embryonic stage 17 } }           # 17
  # Clusterings: the modelled 2-hour windows (NNv1 age) and the two neuronal
  # re-clusterings; each uses the Samples (collection windows) giving at least 1% of its
  # nuclei (curator 2026-10-18: every window has thin tails of likely mis-aged nuclei from
  # distant collections), from .cache/calderon/cells.tsv.gz (export_windows.R).
  min_sample_fraction: 0.01
  clusterings:
    - { id: "0_2", name: "Calderon 2022 clusters, modelled age 0-2 h" }
    - { id: "2_4", name: "Calderon 2022 clusters, modelled age 2-4 h" }
    - { id: "4_6", name: "Calderon 2022 clusters, modelled age 4-6 h" }
    - { id: "6_8", name: "Calderon 2022 clusters, modelled age 6-8 h" }
    - { id: "8_10", name: "Calderon 2022 clusters, modelled age 8-10 h" }
    - { id: "10_12", name: "Calderon 2022 clusters, modelled age 10-12 h" }
    - { id: "12_14", name: "Calderon 2022 clusters, modelled age 12-14 h" }
    - { id: "14_16", name: "Calderon 2022 clusters, modelled age 14-16 h" }
    - { id: "16_18", name: "Calderon 2022 clusters, modelled age 16-18 h" }
    - { id: neuronal, name: "Calderon 2022 neuroectoderm sub-clusters (6-18 h)" }
    - { id: neuronal_mature, name: "Calderon 2022 mature neuron sub-clusters (6-18 h)" }
  # modelled window -> the narrowest FBdv term covering its stages, for the Clusters
  # (curator 2026-10-18); windows only covered by embryonic stage (2-4, 8-10, 12-14 h) get none
  cluster_stages:
    "0_2": { fbdv_id: FBdv:00000054, label: cleavage stage }                 # stages 1-4
    "4_6": { fbdv_id: FBdv:00005321, label: extended germ band stage }       # 9-11
    "6_8": { fbdv_id: FBdv:00004450, label: late extended germ band stage }  # 11-12
    "10_12": { fbdv_id: FBdv:00005331, label: dorsal closure stage }         # 13-15
    "14_16": { fbdv_id: FBdv:00005334, label: embryonic stage 16 }           # 16
    "16_18": { fbdv_id: FBdv:00005335, label: embryonic stage 17 }           # 17

# Clusters (projects/calderon_2022/build_clusters.py): one entry per author cluster per
# modelled window (Table S1) and per neuronal re-clustering. Held (untyped): the authors'
# "ubiquitous", "maternal" and "unknown" clusters.
annotations:
  review_columns: [clustering, source_cluster_id, type, author_germ_layer, author_lineage, author_annotation]

unidentified:
  rule: none

# FBbt mappings are made once per author type (type_mapping/, write_type_mappings.py),
# copied per cluster by scripts/expand_type_mappings.py, then cluster-level exceptions
# applied by override_cluster_mappings.py.
