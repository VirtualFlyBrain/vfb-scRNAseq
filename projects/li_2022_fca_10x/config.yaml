# Fly Cell Atlas (Li et al. 2022). Two ArrayExpress experiments -> two projects
# (one accession = one Dataset): li_2022_fca_10x (E-MTAB-10519) and
# li_2022_fca_ss2 (E-MTAB-10628). Previously loaded into VFB from the Single Cell
# Expression Atlas reprocessing (FBlc0003846 / 4307 / 4785, split by sex); rebuilt
# here from the authors' own analyses (flycellatlas.org), curator decisions
# 2026-10-07: 10x Stringent per tissue + Smart-seq2 per tissue (complete sets);
# relaxed, integrated, cross-tissue and "All" analyses left out; one Cluster per
# author annotation per tissue analysis; author FBbt ids as a first pass.
project: li_2022_fca_10x

source:
  doi: 10.1126/science.abk2432
  pmid: "35239393"
  pmcid: PMC8944923
  fbrf: FBrf0252876          # VFB production :pub node (resolved by PMID)
  title: "Fly Cell Atlas: A single-nucleus transcriptomic atlas of the adult fruit fly"
  journal: Science
  year: 2022
  first_author: Li

organism: Drosophila melanogaster

dataset:
  site: ArrayExpress            # vfb:ArrayExpress Site node added to KBW 2026-10-07
  accession: E-MTAB-10519
  licence: CC-BY-4.0
  label_qualifier: 10x   # "scRNAseq data from Li (2022), 10x": the FCA has two datasets
  assay_type: FBcv:0009001      # single-nucleus RNA-Seq

sample_build:
  source: arrayexpress
  # one biological Sample per author sample (SDRF Extract Name = the FCA h5ad
  # `sample_id`, e.g. 6dae9a5c__FCA47_Male_haltere_adult_5dWT_Luo_sample1): one dissection of
  # one tissue from one sex (61 samples)
  sample_columns: [Extract Name]
  # one Assay per 10x library (SDRF source; 1 or 4 index libraries per sample)
  assay_column: Source Name
  assay_xrefs: ['Comment[ENA_EXPERIMENT]', 'Comment[BioSD_SAMPLE]']
  assay_method: { fbcv_id: FBcv:0009008, label: 10x sequencing }
  # Sample labels end with the authors' sample number (FCA4, FCA10, ...): several
  # samples are otherwise alike (e.g. six male heads). Assay names: the Sample + "10x
  # library <index>" (the library id's S-number, unique within a sample; the full
  # library id is kept as a dbxref).
  sample_label_id: '__(FCA\d+)_'
  assay_label: { unit: 10x library, pattern: '_(S\d+)$', xref_library_id: true }
  sex_column: Characteristics[sex]
  sex_map: { femal: female }  # SDRF typo; "mixed" leaves sex unset
  age_column: Characteristics[age]
  age_unit: days
  age_map:
    "1": { stage: { fbdv_id: "FBdv:00007076", label: "day 1 of adulthood" } }
    "2": { stage: { fbdv_id: "FBdv:00007077", label: "day 2 of adulthood" } }
    "3": { stage: { fbdv_id: "FBdv:00007078", label: "day 3 of adulthood" } }
    "5": { stage: { fbdv_id: "FBdv:00007080", label: "day 5 of adulthood" } }
  # Curator corrections to the SDRF (2026-10-07). The supplement ("Fly sample
  # information") gives 5-day adults for every tissue except the male reproductive
  # gland (2-3 d) and testis (0-1 d), with reasons for those two; the SDRF's 3 days for
  # fat body is taken to be an ArrayExpress error.
  sdrf_corrections:
    - match: { "Characteristics[organism part]": "fat body", "Characteristics[age]": "3" }
      set: { "Characteristics[age]": "5" }
      note: "Age corrected from 3 to 5 days (SDRF) per the paper's supplement, which gives 5-day adults for fat body."
  genotype_columns: ['Characteristics[strain]']
  wild_type_genotypes: [w1118, wild type genotype]
  # Genotype (curator 2026-10-17): the GAL4 > UAS samples come from crosses, so they link
  # the FlyBase genetic entities in the genotype (`genotype_includes`, GENO:0000222
  # has_genotype), at allele (FBal) level for now (FBti may be preferred later), not a
  # stock (BDSC 7378, the UAS-lamGFP parent, would be only half the genotype). Alleles
  # as FlyBase curated them for this paper (Chado feature_pub, FBrf0252876; supplement
  # "Fly sample information", science.abk2432_sm.pdf p4-5), plus unambiguous ones it did
  # not link: tub-GAL80ts in the trachea cross ("btl-GAL4, tub-Gal80ts flies with
  # UAS-lamGFP") = FBal0147425. Not linked (not identifiable): UAS-nlsGFP (several
  # constructs) and UAS-unc84GFP (from Ref. 48; no FlyBase construct found).
  genotype_includes_map:
    "Cg-GAL4, UAS-lamGFP": [FBal0341663, FBal0119470]   # Scer\GAL4[Cg.PU]; Lam[UAS.GFP]
    "Btl-GAL4, UAS-lamGFP": [FBal0052380, FBal0147425, FBal0119470]   # Scer\GAL4[btl.PS]; Scer\GAL80[ts.alphaTub84B] (tub-GAL80ts); Lam[UAS.GFP]
    "PromE800-GAL4, UAS-unc84GFP": [FBal0243539]   # Scer\GAL4[Desat1.PB]
    "drip-GAL4, UAS-nlsGFP": [FBal0327974]   # Scer\GAL4[Drip-MI00887-TG4.0]
  tissue_column: Characteristics[organism part]
  # Organism part -> FBbt, following the authors' SDRF annotation (not the driver).
  # Samples *overlap* (RO:0002131) these terms, so a sample may contain other
  # material too (e.g. "body wall" includes muscle and neurons as well as integument).
  # Curator-reviewed 2026-10-07.
  tissue_map:
    "antenna":
      - { fbbt_id: "FBbt:00004511", label: "antenna" }
    "body wall":
      - { fbbt_id: "FBbt:00005396", label: "adult integumentary system" }
    "fat body":
      - { fbbt_id: "FBbt:00003209", label: "adult fat body" }
    "haltere":
      - { fbbt_id: "FBbt:00004783", label: "haltere" }
    "head":
      - { fbbt_id: "FBbt:00003007", label: "adult head" }
    "heart":
      - { fbbt_id: "FBbt:00003154", label: "adult heart" }
    "leg":
      - { fbbt_id: "FBbt:00004640", label: "leg" }
    "ovary":
      - { fbbt_id: "FBbt:00004865", label: "ovary" }
    "testis":
      - { fbbt_id: "FBbt:00004928", label: "testis" }
    "thorax":
      - { fbbt_id: "FBbt:00003018", label: "adult thorax" }
    "trachea":
      - { fbbt_id: "FBbt:00003037", label: "adult tracheal system" }
    "wing":
      - { fbbt_id: "FBbt:00004729", label: "wing" }
    "body":  # whole fly minus head; term defined from this paper
      - { fbbt_id: "FBbt:00059181", label: "adult postcephalic region" }
    "digestive system":
      - { fbbt_id: "FBbt:00003123", label: "adult digestive system" }
    "male reproductive gland":  # accessory gland + ejaculatory duct + ejaculatory bulb
      - { fbbt_id: "FBbt:00004959", label: "male accessory gland" }
      - { fbbt_id: "FBbt:00004965", label: "ejaculatory duct" }
      - { fbbt_id: "FBbt:00004962", label: "ejaculatory bulb" }
    "malpighian tubule":
      - { fbbt_id: "FBbt:00005725", label: "adult Malpighian tubule" }
    "mixed proboscis and maxillary palpus":
      - { fbbt_id: "FBbt:00004535", label: "proboscis" }
      - { fbbt_id: "FBbt:00004546", label: "maxillary palp" }
  # one Clustering per author tissue analysis (10x Stringent, flycellatlas.org)
  clusterings:
    - { id: head, name: "Fly Cell Atlas 10x Stringent Head",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/LAEybPc2HZnpzKs" }
    - { id: body, name: "Fly Cell Atlas 10x Stringent Body",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/nXnbWzQnLxTXmMT" }
    - { id: antenna, name: "Fly Cell Atlas 10x Stringent Antenna",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/jpLWSwcA638yZka" }
    - { id: body_wall, name: "Fly Cell Atlas 10x Stringent Body Wall",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/sZZMSbcNk4SWtHE" }
    - { id: fat_body, name: "Fly Cell Atlas 10x Stringent Fat Body",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/zca3Es6MNx9TDsy" }
    - { id: gut, name: "Fly Cell Atlas 10x Stringent Gut",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/TfX7etSc5NnmFAz" }
    - { id: haltere, name: "Fly Cell Atlas 10x Stringent Haltere",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/QDtoYjpfQgey5aq" }
    - { id: heart, name: "Fly Cell Atlas 10x Stringent Heart",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/sCB3bs3Yg5ypaBS" }
    - { id: leg, name: "Fly Cell Atlas 10x Stringent Leg",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/ofHeNRbZPn52QtT" }
    - { id: male_reproductive_glands, name: "Fly Cell Atlas 10x Stringent Male Reproductive Glands",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/B4kH5SiLPF24nsC" }
    - { id: malpighian_tubule, name: "Fly Cell Atlas 10x Stringent Malpighian Tubule",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/qDRy6NqxmqN7SxS" }
    - { id: oenocyte, name: "Fly Cell Atlas 10x Stringent Oenocyte",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/WdSri425t88B7JA" }
    - { id: ovary, name: "Fly Cell Atlas 10x Stringent Ovary",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/zgZe3Zsegpn5Bpg" }
    - { id: proboscis_and_maxillary_palps, name: "Fly Cell Atlas 10x Stringent Proboscis and Maxillary Palps",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/gGsWF6PRk45Apan" }
    - { id: testis, name: "Fly Cell Atlas 10x Stringent Testis",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/A2jn7iTEeRgMkc3" }
    - { id: trachea, name: "Fly Cell Atlas 10x Stringent Trachea",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/j3kQTf5KifXyBYr" }
    - { id: wing, name: "Fly Cell Atlas 10x Stringent Wing",
        h5ad: "https://cloud.flycellatlas.org/index.php/s/eAD6HL7TaesZ6GM" }

# Summary expression (scripts/build_expression.py) from the same h5ad files. Each
# file's `raw.X` holds all retained genes as log(counts per 10,000 + 1) (the main `X`
# is scaled, highly variable genes only), converted to CPM as (e^x - 1) x 100; the
# build checks every cell sums to 1e6. Cells count towards their author annotation
# (the Cluster label), as in cell_type_annotations.json.
expression:
  source: h5ad
  values: log1p_cp10k
  normalisation: CPM
  extent_cutoff: 0.2
  hide_in_terminfo: "true"
  gzip_tsv: true          # expression.tsv.gz (too large to commit plain)
  # gene symbol -> current FlyBase gene (scripts/update_gene_ids.py); ids from the
  # authors' files where given (also from Smart-seq2), else looked up by symbol
  gene_id_map: gene_id_map.tsv
  gene_ids_from: [li_2022_fca_ss2]

# Author annotations from the per-analysis h5ad files (scripts/fetch_h5ad.py, then
# scripts/build_annotations_from_h5ad.py). `annotation` is the authors' stringent
# typing (consensus across Leiden resolutions); `R_annotation` (a transferred
# relaxed-analysis label) is not used.
annotation_build:
  annotation_column: annotation
  ontology_column: annotation__ontology_id       # author FBbt id, or "Manual Annotation"
  broad_column: annotation_broad
  broad_ontology_column: annotation_broad__ontology_id
  sex_column: sex
  unannotated_values: [unannotated, artefact]

annotations:
  # shown after the cluster key in mapping.tsv
  review_columns: [clustering, source_cluster_id, type, author_ontology_id, author_broad]

# The authors' leftover ("unannotated") and "artefact" cells of each analysis are one
# entry each, flagged `unannotated` and held: listed in mapping.tsv with a
# hold_reason, never loaded.
unidentified:
  rule: none
  hold_unidentified: true
  hold_reasons: {unannotated: leftover, artefact: artefact}

# FBbt mappings are made once per author type (type_mapping/: scripted confirmations
# from confirm_author_terms.py + map-clusters-to-fbbt agents from reports/) and copied
# per cluster by scripts/expand_type_mappings.py (also used by li_2022_fca_ss2).
