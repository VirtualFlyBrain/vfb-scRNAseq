# Fly Cell Atlas (Li et al. 2022). Two ArrayExpress experiments -> two projects
# (one accession = one Dataset): li_2022_fca_10x (E-MTAB-10519) and
# li_2022_fca_ss2 (E-MTAB-10628). Previously loaded into VFB from the Single Cell
# Expression Atlas reprocessing (FBlc0003846 / 4307 / 4785, split by sex); rebuilt
# here from the authors' own analyses (flycellatlas.org), curator decisions
# 2026-10-07: 10x Stringent per tissue + Smart-seq2 per tissue (complete sets);
# relaxed, integrated, cross-tissue and "All" analyses left out; one Cluster per
# author annotation per tissue analysis; author FBbt ids as a first pass.
project: li_2022_fca_10x

source:
  doi: 10.1126/science.abk2432
  pmid: "35239393"
  pmcid: PMC8944923
  fbrf: FBrf0252876          # VFB production :pub node (resolved by PMID)
  title: "Fly Cell Atlas: A single-nucleus transcriptomic atlas of the adult fruit fly"
  journal: Science
  year: 2022
  first_author: Li

organism: Drosophila melanogaster

dataset:
  site: ArrayExpress            # NB VFB has no ArrayExpress Site node yet (vfb:ArrayExpress)
  accession: E-MTAB-10519
  licence: CC-BY-4.0
  assay_type: FBcv:0009001      # single-nucleus RNA-Seq

sample_build:
  source: arrayexpress
  # one biological Sample per author sample (SDRF Extract Name = the FCA h5ad
  # `sample_id`, e.g. 6dae9a5c__FCA47_Male_haltere_adult_5dWT_Luo_sample1): one dissection of
  # one tissue from one sex (61 samples)
  sample_columns: [Extract Name]
  # one Assay per 10x library (SDRF source; 1 or 4 index libraries per sample)
  assay_column: Source Name
  assay_xrefs: ['Comment[ENA_EXPERIMENT]', 'Comment[BioSD_SAMPLE]']
  assay_method: { fbcv_id: FBcv:0009008, label: 10x sequencing }
  sex_column: Characteristics[sex]
  sex_map: { femal: female }  # SDRF typo; "mixed" leaves sex unset
  age_column: Characteristics[age]
  age_unit: days
  age_map:
    "1": { stage: { fbdv_id: "FBdv:00007076", label: "day 1 of adulthood" } }
    "2": { stage: { fbdv_id: "FBdv:00007077", label: "day 2 of adulthood" } }
    "3": { stage: { fbdv_id: "FBdv:00007078", label: "day 3 of adulthood" } }
    "5": { stage: { fbdv_id: "FBdv:00007080", label: "day 5 of adulthood" } }
  genotype_columns: ['Characteristics[strain]']
  wild_type_genotypes: [w1118, wild type genotype]
  # FlyBase stocks: not yet resolved. The SDRF gives only genotypes (w1118 and
  # GAL4 > UAS reporter lines); FlyBase has no stocks curated for FBrf0252876 and
  # the paper's supplement (methods) could not be fetched automatically. Fill in
  # from the supplement's fly stock list (BDSC numbers -> FBst via Chado).
  stock_map: {}
  tissue_column: Characteristics[organism part]
  # Organism part -> FBbt, following the authors' SDRF annotation (not the driver).
  # Entries marked REVIEW are curator judgement calls.
  tissue_map:
    "antenna":
      - { fbbt_id: "FBbt:00004511", label: "antenna" }
    "body wall":  # REVIEW
      - { fbbt_id: "FBbt:00005396", label: "adult integumentary system" }
    "fat body":
      - { fbbt_id: "FBbt:00003209", label: "adult fat body" }
    "haltere":
      - { fbbt_id: "FBbt:00004783", label: "haltere" }
    "head":
      - { fbbt_id: "FBbt:00003007", label: "adult head" }
    "heart":
      - { fbbt_id: "FBbt:00003154", label: "adult heart" }
    "leg":
      - { fbbt_id: "FBbt:00004640", label: "leg" }
    "ovary":
      - { fbbt_id: "FBbt:00004865", label: "ovary" }
    "testis":
      - { fbbt_id: "FBbt:00004928", label: "testis" }
    "thorax":
      - { fbbt_id: "FBbt:00003018", label: "adult thorax" }
    "trachea":
      - { fbbt_id: "FBbt:00003037", label: "adult tracheal system" }
    "wing":
      - { fbbt_id: "FBbt:00004729", label: "wing" }
    "body":  # REVIEW
      - { fbbt_id: "FBbt:00003018", label: "adult thorax" }
      - { fbbt_id: "FBbt:00003023", label: "adult abdomen" }
    "digestive system":
      - { fbbt_id: "FBbt:00003123", label: "adult digestive system" }
    "male reproductive gland":  # REVIEW
      - { fbbt_id: "FBbt:00004959", label: "male accessory gland" }
    "malpighian tubule":
      - { fbbt_id: "FBbt:00005725", label: "adult Malpighian tubule" }
    "mixed proboscis and maxillary palpus":
      - { fbbt_id: "FBbt:00004535", label: "proboscis" }
      - { fbbt_id: "FBbt:00004546", label: "maxillary palp" }
  # one Clustering per author tissue analysis (10x Stringent, flycellatlas.org)
  clusterings:
    - { id: head, name: "Fly Cell Atlas 10x Stringent Head" }
    - { id: body, name: "Fly Cell Atlas 10x Stringent Body" }
    - { id: antenna, name: "Fly Cell Atlas 10x Stringent Antenna" }
    - { id: body_wall, name: "Fly Cell Atlas 10x Stringent Body Wall" }
    - { id: fat_body, name: "Fly Cell Atlas 10x Stringent Fat Body" }
    - { id: gut, name: "Fly Cell Atlas 10x Stringent Gut" }
    - { id: haltere, name: "Fly Cell Atlas 10x Stringent Haltere" }
    - { id: heart, name: "Fly Cell Atlas 10x Stringent Heart" }
    - { id: leg, name: "Fly Cell Atlas 10x Stringent Leg" }
    - { id: male_reproductive_glands, name: "Fly Cell Atlas 10x Stringent Male Reproductive Glands" }
    - { id: malpighian_tubule, name: "Fly Cell Atlas 10x Stringent Malpighian Tubule" }
    - { id: oenocyte, name: "Fly Cell Atlas 10x Stringent Oenocyte" }
    - { id: ovary, name: "Fly Cell Atlas 10x Stringent Ovary" }
    - { id: proboscis_and_maxillary_palps, name: "Fly Cell Atlas 10x Stringent Proboscis and Maxillary Palps" }
    - { id: testis, name: "Fly Cell Atlas 10x Stringent Testis" }
    - { id: trachea, name: "Fly Cell Atlas 10x Stringent Trachea" }
    - { id: wing, name: "Fly Cell Atlas 10x Stringent Wing" }
