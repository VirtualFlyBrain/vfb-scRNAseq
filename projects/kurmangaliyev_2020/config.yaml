# Project config for the first worked example.
# Kurmangaliyev et al. 2020, Drosophila visual system developmental atlas.
project: kurmangaliyev_2020

source:
  doi: 10.1016/j.neuron.2020.10.006
  pmid: "33125872"
  # FlyBase reference id for the paper's VFB :pub node. The build checks the VFB
  # curation KB by PMID first (to catch a freshly-added pub); this is the fallback
  # used when the KB has no match. Confirmed present in VFB production (get_term_info).
  fbrf: FBrf0247594
  title: Transcriptional Programs of Circuit Assembly in the Drosophila Visual System
  journal: Neuron
  year: 2020
  first_author: Kurmangaliyev   # surname; used for entity rdfs:labels (citation form)

organism: Drosophila melanogaster

# Dataset-level metadata -> maps to the LinkML `Dataset` class.
# GEO/SRA accessions are cross-references (schema `site` + `accession` slots),
# NOT the minted VFBseq IRI.
dataset:
  site: GEO                       # VFB Site node short_form (vfb:GEO); build.py CURIE-ifies it
  accession: GSE156455
  bioproject: PRJNA658010
  sra_study: SRP278058
  platform: GPL25244            # Illumina NovaSeq 6000
  licence: CC-BY-4.0
  assay_type: FBcv:0009000      # single-cell RNA-seq

# Biological samples -> LinkML `Sample` / `Assay`, built from GEO by
# scripts/build_samples_from_geo.py (config-driven; see sample_build below).

sample_build:
  # GSM titles are "set_timepoint_biorep_techrep" (e.g. W1118_24h_A_1).
  # Biological Sample = set_timepoint_biorep; Assay = each techrep (one 10x library = one GSM).
  title_pattern: set_timepoint_biorep_techrep
  assay_method: { fbcv_id: FBcv:0009008, label: 10x sequencing }
  # Sex is NOT recorded in GEO for this dataset. Confirmed FEMALE from the paper
  # (Kurmangaliyev et al. 2020 dissected female optic lobes). This curator-confirmed
  # value is used because GEO carries no sex characteristic; if it were also absent
  # here, build_samples_from_geo.py warns the curator to check the paper.
  sex: female
  # set -> FlyBase stock ref(s) (FBst), from the paper's Key Resources Table
  # (resolved via FlyBase Chado). Bare FBst ids; build.py emits them as FlyBase: CURIEs
  # and the schema links them via BAO:0095000 'is derived from'. The stock resolves to
  # the strain genotype in FlyBase, and the strain (DGRP/W1118) is in the sample label,
  # so no separate free-text genotype field is kept. Pooled samples get ALL applicable
  # stocks.
  #  - W1118: the w[1118] background, BDSC #5905 = FBst0005905. (The paper's KRT table
  #    has a typo "BDSC:5909" — an unrelated FRT stock — but the text says "w[1118]
  #    (BDSC #5905)", so 5905 is correct.)
  #  - DGRP: DGRP_All samples pool the 35 DGRP lines listed in the KRT (reshuffled
  #    across timepoints/replicates), so all 35 stocks are linked to each DGRP sample.
  stock_map:
    W1118: [FBst0005905]
    DGRP:
      - FBst0025177  # DGRP-304
      - FBst0025179  # DGRP-307
      - FBst0025182  # DGRP-324
      - FBst0025191  # DGRP-391
      - FBst0025194  # DGRP-437
      - FBst0028122  # DGRP-21
      - FBst0028124  # DGRP-28
      - FBst0028141  # DGRP-129
      - FBst0028150  # DGRP-177
      - FBst0028151  # DGRP-181
      - FBst0028152  # DGRP-189
      - FBst0028185  # DGRP-374
      - FBst0028189  # DGRP-382
      - FBst0028190  # DGRP-383
      - FBst0028198  # DGRP-441
      - FBst0028200  # DGRP-461
      - FBst0028203  # DGRP-492
      - FBst0028205  # DGRP-508
      - FBst0028213  # DGRP-589
      - FBst0028224  # DGRP-748
      - FBst0028232  # DGRP-790
      - FBst0028237  # DGRP-805
      - FBst0028239  # DGRP-810
      - FBst0028242  # DGRP-819
      - FBst0028249  # DGRP-850
      - FBst0028260  # DGRP-897
      - FBst0028275  # DGRP-235
      - FBst0029651  # DGRP-40
      - FBst0029654  # DGRP-320
      - FBst0029657  # DGRP-406
      - FBst0055019  # DGRP-348
      - FBst0055020  # DGRP-354
      - FBst0055022  # DGRP-395
      - FBst0055024  # DGRP-505
      - FBst0055038  # DGRP-355
  # Keyed on the GEO `age` characteristic (age_raw), NOT the sample-title token,
  # because the token is not 1:1 with developmental age (e.g. the sample titled
  # 'Adult' has age 96h APF = pharate adult, not adult). Curated.
  # NB the atlas is developmental (pupal 24-96h APF); 24h tissue is the immature
  # (embryonic/larval) optic lobe. 'P-stage' is broader than 'pupal stage'.
  age_map:
    "24h APF":
      stage:  { fbdv_id: FBdv:00005349, label: pupal stage }
      tissue: { fbbt_id: FBbt:00001930, label: embryonic/larval optic lobe }
    "48h APF":
      stage:  { fbdv_id: FBdv:00006011, label: pharate adult stage }
      tissue: { fbbt_id: FBbt:00003701, label: adult optic lobe }
    "72h APF":
      stage:  { fbdv_id: FBdv:00006011, label: pharate adult stage }
      tissue: { fbbt_id: FBbt:00003701, label: adult optic lobe }
    "96h APF":
      stage:  { fbdv_id: FBdv:00006011, label: pharate adult stage }
      tissue: { fbbt_id: FBbt:00003701, label: adult optic lobe }
    "0-96h APF":
      stage:  { fbdv_id: FBdv:00007001, label: P-stage }
      tissue: { fbbt_id: FBbt:00003701, label: adult optic lobe }
  # clustering analyses present in this dataset (GEO subsets): the main dataset
  # (24-96h APF, 196 clusters) and the separately clustered early dataset (0-24h APF,
  # 110 clusters; 24h cells are in both).
  clusterings:
    - { id: main, name: "Kurmangaliyev 2020 main dataset clustering (24-96h APF, 196 clusters)" }
    - { id: early, name: "Kurmangaliyev 2020 early dataset clustering (0-24h APF, 110 clusters)" }

# Summary expression statistics (extent + CPM level per cluster x gene).
# Matrix/features/barcodes are the 10x MEX files in .cache (metadata + label column
# reuse the `annotations` section). extent_cutoff 0.2 matches the old repo.
expression:
  matrix_file: GSE156455_matrix_main.mtx.gz
  features_file: GSE156455_features_main.tsv.gz
  barcodes_file: GSE156455_barcodes_main.tsv.gz
  normalisation: CPM
  extent_cutoff: 0.2
  hide_in_terminfo: "true"
  # current FlyBase gene ids (scripts/update_gene_ids.py; FB2026_03): retired ids ->
  # current gene (merges summed per cell), split/withdrawn ids dropped
  gene_id_map: gene_id_map.tsv
  # the early dataset is a separate matrix (same genes); its clusters are labelled
  # early_<cluster> as in cell_type_annotations.json
  extra_parts:
    - matrix_file: GSE156455_matrix_early.mtx.gz
      features_file: GSE156455_features_early.tsv.gz
      barcodes_file: GSE156455_barcodes_early.tsv.gz
      metadata_file: GSE156455_metadata_early.tsv.gz
      label_prefix: early_

# --- Project-specific pipeline config (read by the generic scripts) ---

# How to read the source metadata table into cell_type_annotations.json.
# Column names follow GSE156455's metadata_main.tsv.gz convention.
annotations:
  source_file: GSE156455_metadata_main.tsv.gz   # GEO supplementary metadata file
  subset: main
  label_column: subtype          # the cluster label (finest resolved identity)
  class_column: class            # author cell class (drives the broad-match ceiling)
  carry_columns: [type, class]   # extra columns recorded per annotation
  timepoint_column: time
  # One row per author cluster: the main dataset's 196 clusters (subtype = the
  # clustering's populations) plus the early dataset's 110 clusters. Labels carry
  # their clustering (main_L1, early_L1).
  label_prefix: main_
  clustering_id: main
  clustering_name: "main dataset, 24-96h APF"
  extra_clusterings:
    - id: early
      name: "early dataset, 0-24h APF"
      source_file: GSE156455_metadata_early.tsv.gz
      label_prefix: early_

# How to handle clusters with no named cell-type identity.
unidentified:
  # Rule for detecting an unidentified numbered cluster. Options:
  #   class_prefixed_numbered  -> label == <class-code><digits> (e.g. N1, G37, C16)
  #   none                     -> no clusters are treated as placeholders
  #   "regex:<pattern>"        -> custom full-match regex on the label
  rule: class_prefixed_numbered
  hold_classes: [C, x]           # classes of undefined meaning -> held, not mapped
                                 # (x = unresolved, early dataset only)
  # Broad FBbt anchor per author class, used for unidentified clusters (this tissue).
  class_anchors:
    N:
      fbbt_id: FBbt:00003702
      label: adult optic lobe neuron
      definition: Neuron of the adult optic lobe.
    G:
      fbbt_id: FBbt:00100517
      label: adult optic lobe glial cell
      definition: Glial cell of the adult that is associated with the optic lobe.
    R:
      fbbt_id: FBbt:00006009
      label: eye photoreceptor cell
      definition: Photoreceptor cell of the compound eye.
  # Early dataset (0-24h APF): the adult anchors above are the wrong stage.
  clustering_class_anchors:
    early:
      N:
        fbbt_id: FBbt:00053539
        label: immature adult optic lobe neuron
        definition: Immature neuron that develops from an optic neuroblast and will become an adult optic lobe neuron.
      G:
        # FBbt has no immature/pupal optic lobe glia term; stage-neutral class used
        fbbt_id: FBbt:00005144
        label: glial cell
        definition: A supporting cell of the nervous system.
