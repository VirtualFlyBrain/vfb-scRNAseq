# Li, Horns et al. 2017 (Cell; FBrf0237214): Smart-seq2 of FACS-sorted olfactory
# projection neurons (PNs), one GEO sample per cell (GSE100058). Not previously in VFB.
# Its 24 h APF GH146 cells are reused by Xie et al. 2021 (xie_2021), so this study is
# curated first (entity reuse rule). Curator decisions 2026-10-17: load the two author
# analyses with per-cell assignments in the authors' repository (github.com/felixhorns/
# FlyPN, data/): the GH146 24 h APF clusters (HDBSCAN on ICIM genes, labels_HDBSCAN.csv:
# clusters 0-29) and the Mz19 developmental series (per-stage PN type lists, names_*.txt);
# not the astrocyte / C155 controls (not clustered). Samples are built by
# projects/li_2017/build_samples.py from GEO and the authors' library table
# (GSE100058_df_libs.csv.gz: library, experiment, plate, driver / stage label).
project: li_2017

source:
  doi: 10.1016/j.cell.2017.10.019
  pmid: "29149607"
  pmcid: PMC6095479
  fbrf: FBrf0237214
  title: "Classifying Drosophila Olfactory Projection Neuron Subtypes by Single-Cell RNA Sequencing"
  journal: Cell
  year: 2017
  first_author: Li

organism: Drosophila melanogaster

dataset:
  site: GEO
  accession: GSE100058
  bioproject: PRJNA390607
  sra_study: SRP109266
  platform: GPL22106            # Illumina NextSeq 500
  licence: CC-BY-4.0
  assay_type: FBcv:0009000      # single-cell RNA-seq

sample_build:
  # One Sample per sort: the authors' `experiment` x driver / stage `label` (a batch of
  # brains dissected and sorted together); one Assay per Smart-seq2 plate (`plate`; the
  # pooled sequencing library where no plate is recorded). Cells come one per GSM, titled
  # "<driver> [<library>]".
  assay_method: { fbcv_id: FBcv:0009007, label: Smart-seq2 }
  # Paper: "In all experiments, both male and female flies were used" (pooled: unset).
  sex: mixed
  # Drivers (crosses with UAS-mCD8GFP): the GAL4 alleles FlyBase curated for the paper
  # (scripts/flybase_pub_entities.py --fbrf FBrf0237214); the UAS-mCD8GFP reporter is not
  # identified (several constructs), so not linked.
  drivers:
    GH146-GFP: { name: GH146-GAL4 > UAS-mCD8GFP, genotype_includes: [FBal0218122] }   # Scer\GAL4[GH146]
    Mz19-GFP:  { name: Mz19-GAL4 > UAS-mCD8GFP,  genotype_includes: [FBal0155865] }   # Scer\GAL4[Mz19]
  # Stage (from the label; GH146 sorts are all 24 h APF): Bainbridge & Bownes FBdv stages
  # (25 C), as for Özel 2021 / Hörmann 2020; tissue: whole brains were dissected, so brain
  # to the pupal stage and adult brain from the pharate adult stage (as for Hörmann).
  stages:
    "24hAPF":
      age: 24 h APF       # Mz19: "24-30h APF"
      stage:  { fbdv_id: FBdv:00005353, label: pupal stage P6 }
      tissue: { fbbt_id: FBbt:00005095, label: brain }
    "36hAPF":
      age: 36 h APF
      stage:  { fbdv_id: FBdv:00005354, label: pupal stage P7 }
      tissue: { fbbt_id: FBbt:00005095, label: brain }
    "48hAPF":
      age: 48 h APF
      stage:  { fbdv_id: FBdv:00005355, label: pharate adult stage P8 }
      tissue: { fbbt_id: FBbt:00003624, label: adult brain }
    "72hAPF":
      age: 72 h APF
      stage:  { fbdv_id: FBdv:00005356, label: pharate adult stage P9 }
      tissue: { fbbt_id: FBbt:00003624, label: adult brain }
    "adult":
      age: adult
      stage:  { fbdv_id: FBdv:00005369, label: adult stage }
      tissue: { fbbt_id: FBbt:00003624, label: adult brain }
  clusterings:
    - { id: GH146_24h, name: "Li 2017 GH146 PN clusters (24 h APF)", driver: GH146-GFP }
    - { id: Mz19_24h, name: "Li 2017 Mz19 PN types (24 h APF)", driver: Mz19-GFP, stage: 24hAPF }
    - { id: Mz19_36h, name: "Li 2017 Mz19 PN types (36 h APF)", driver: Mz19-GFP, stage: 36hAPF }
    - { id: Mz19_48h, name: "Li 2017 Mz19 PN types (48 h APF)", driver: Mz19-GFP, stage: 48hAPF }
    - { id: Mz19_72h, name: "Li 2017 Mz19 PN types (72 h APF)", driver: Mz19-GFP, stage: 72hAPF }
    - { id: Mz19_adult, name: "Li 2017 Mz19 PN types (adult)", driver: Mz19-GFP, stage: adult }

# Clusters (projects/li_2017/build_clusters.py, from the authors' repository files in
# .cache/li2017/). GH146 24 h: the HDBSCAN clusters (labels_HDBSCAN.csv). The paper names
# its decoded clusters by figure label (#1-#6'), not by HDBSCAN number; the link is made by
# the authors' own criteria (driver cells mapped onto the clusters with a random forest on
# their ICIM genes, and the defining markers; projects/li_2017/match_clusters.py ->
# cluster_matching.tsv; curator 2026-10-17). Clusters the paper did not decode stay
# numbered (held: untyped); -1 = not clustered (held: unassigned).
decoded_clusters:
  "22": { type: DC2,  figure: "#1",  basis: "all 23 91G04+ cells map to it (paper: 91G04+ PNs map to Cluster #1, DC2)" }
  "8":  { type: DA1,  figure: "#2",  basis: "66 of 74 Mz19+ DA1 cells map to it; acj6-, CG31676+, fru+ (paper: fru only in the large DA1 cluster #2)" }
  "5":  { type: DA1,  figure: "#2'", basis: "8 of 74 Mz19+ DA1 cells map to it; acj6-, CG31676+, fru low (paper: DA1 #2')" }
  "7":  { type: VA1d, figure: "#3",  basis: "all 12 Mz19+ VA1d cells map to it; acj6+, CG31676+ (paper: Cluster #3, CG31676+, VA1d)" }
  "12": { type: DC3,  figure: "#4",  basis: "all 32 Mz19+ DC3 cells map to it; acj6+, CG31676- (paper: Cluster #4, CG31676-, DC3)" }
  "2":  { type: VM2,  figure: "#5",  basis: "25 of 28 trol+ NP5103 cells map to it; trol high (paper: trol+ Cluster #5, VM2)" }
  "20": { type: DL3,  figure: "#6",  basis: "acj6-, CG31676+, not DA1 (paper: the remaining acj6-/CG31676+ Clusters #6 and #6', DL3)" }
  "21": { type: DL3,  figure: "#6'", basis: "acj6-, CG31676+, not DA1 (paper: the remaining acj6-/CG31676+ Clusters #6 and #6', DL3)" }
# Mz19 developmental series: the authors' per-type, per-stage cell lists; VA1d and DC3 are
# not separated in adults (one adPN list: "VA1d or DC3"). Sorted Mz19 cells in no list
# (low quality, or not typed) are in no cluster.
mz19_lists:
  24hAPF: { DA1: names_DA1_24hAPF.txt, VA1d: names_VA1d_24hAPF.txt, DC3: names_DC3_24hAPF.txt }
  36hAPF: { DA1: names_DA1_36hAPF.txt, VA1d: names_VA1d_36hAPF.txt, DC3: names_DC3_36hAPF.txt }
  48hAPF: { DA1: names_DA1_48hAPF.txt, VA1d: names_VA1d_48hAPF.txt, DC3: names_DC3_48hAPF.txt }
  72hAPF: { DA1: names_DA1_72hAPF.txt, VA1d: names_VA1d_72hAPF.txt, DC3: names_DC3_72hAPF.txt }
  adult:  { DA1: names_DA1_adult.txt, "VA1d or DC3": names_adPN_adult.txt }

annotations:
  review_columns: [clustering, source_cluster_id, type, author_note]

unidentified:
  rule: none
  hold_reasons:
    "unclustered": unassigned

# FBbt mappings once per author type, in two sets (curator 2026-10-17: immature terms up to
# the pupal stage, mature from the pharate adult stage; write_type_mappings.py):
# type_mapping/ for Mz19 48 h / 72 h / adult; type_mapping/immature/ for GH146 24 h and
# Mz19 24 h / 36 h (held: FBbt has no immature PN terms; to be requested with Xie 2021).
type_mapping:
  clustering_dirs:
    GH146_24h: immature
    Mz19_24h: immature
    Mz19_36h: immature
