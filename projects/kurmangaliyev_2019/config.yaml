# Kurmangaliyev et al. 2019 (eLife 8:e50822; FBrf0244060): single-cell 10x of T4/T5
# neurons at 24 and 48 h APF (GEO GSE126139, one library per stage). 23G12-GAL4 >
# UAS-H2A::GFP female pupae; optic lobes dissected and the GFP+ T4/T5 cells FACS-sorted.
# Not in the old FlyBase/SCEA load (FlyBase curated only genes for the paper; SCEA
# E-GEOD-126139 labels every cell only "mixed T4 and T5"). Curator decisions 2026-11-16,
# as for Hörmann 2020: one Clustering per stage, one Cluster per author cluster (the
# authors analysed the two stages separately and assigned each stage's 8 clusters to the
# subtypes T4a-d / T5a-d); cell membership from the authors' per-cell files on GEO
# (GSM*_clust24/48.txt; cells marked "filtered" are left out).
project: kurmangaliyev_2019

source:
  doi: 10.7554/eLife.50822
  pmid: "31687928"
  pmcid: PMC6855804
  fbrf: FBrf0244060
  title: Modular transcriptional programs separately define axon and dendrite connectivity
  journal: eLife
  year: 2019
  first_author: Kurmangaliyev

organism: Drosophila melanogaster

dataset:
  site: GEO
  accession: GSE126139
  bioproject: PRJNA521120
  sra_study: SRP184201
  platform: GPL21306            # Illumina HiSeq 4000
  licence: CC-BY-4.0
  assay_type: FBcv:0009000      # single-cell RNA-seq

sample_build:
  # GSM titles are "T4/T5 <n>h APF": one 10x library per stage, so Sample:Assay 1:1.
  title_pattern: 'regex:T4/T5 (?P<timepoint>\d+h) APF'
  assay_method: { fbcv_id: FBcv:0009008, label: 10x sequencing }
  assay_label: { unit: 10x library }
  # Methods: "F1-generation female white pre-pupae were collected at 0 hr APF and reared
  # at 25°C" (GEO records no sex).
  sex: female
  # Genotype: 23G12-GAL4 (BDSC 49044) > UAS-H2A::GFP, a cross, so the Samples link the
  # GAL4 insertion P{GMR23G12-GAL4}attP2 (FBti0134091). UAS-H2A::GFP was a gift from
  # Pfeiffer and Rubin that FlyBase does not identify, so the effector is not linked
  # (as for Hörmann 2020).
  genotype_includes: [FBti0134091]
  # GEO age -> FBdv (Bainbridge & Bownes, 25 °C) and the dissected optic lobe, as for
  # Özel 2021 / Kurmangaliyev 2020: embryonic/larval optic lobe to the pupal stage, adult
  # optic lobe from the pharate adult stage.
  age_map:
    "24h APF":
      stage:  { fbdv_id: FBdv:00005353, label: pupal stage P6 }          # 18.7-32.4 h APF
      tissue: { fbbt_id: FBbt:00001930, label: embryonic/larval optic lobe }
    "48h APF":
      stage:  { fbdv_id: FBdv:00005355, label: pharate adult stage P8 }  # 44.3-56.6 h APF
      tissue: { fbbt_id: FBbt:00003701, label: adult optic lobe }
  # One Clustering per stage: the authors' 8 clusters at that stage, linked to that
  # stage's sample.
  clusterings:
    - { id: "24h", name: "Kurmangaliyev 2019 24 h APF T4/T5 clusters", sample_age: "24h APF" }
    - { id: "48h", name: "Kurmangaliyev 2019 48 h APF T4/T5 clusters", sample_age: "48h APF" }

# Clusters (projects/kurmangaliyev_2019/build_clusters.py, from the GEO per-cell files):
# one entry per stage x subtype.
annotations:
  review_columns: [clustering, source_cluster_id, type]

unidentified:
  rule: none

# FBbt mappings per author subtype, shared with Hörmann 2020 (immature terms up to the
# pupal stage, mature from the pharate adult stage): its type_mapping/immature/ for 24h,
# type_mapping/ for 48h.
type_mapping:
  from: hormann_2020
  clustering_dirs:
    24h: immature

# Summary expression from the GEO CellRanger matrices (raw UMI counts), the two libraries
# side by side (combine_matrices.py; cells <stage>_<barcode>), cell -> cluster from
# build_clusters.py's memberships (the authors' labelled cells only), CPM over each cell's
# own counts. Features are FlyBase 6.22 FBgn ids, mapped to current FlyBase genes.
expression:
  matrix_file: kurmangaliyev_2019/combined/matrix.mtx.gz
  features_file: kurmangaliyev_2019/combined/features.tsv.gz
  barcodes_file: kurmangaliyev_2019/combined/barcodes.tsv.gz
  membership_file: kurmangaliyev_2019/memberships.tsv.gz
  normalisation: CPM
  extent_cutoff: 0.2
  hide_in_terminfo: "true"
  gzip_tsv: true
  gene_id_map: gene_id_map.tsv
