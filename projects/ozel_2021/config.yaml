# Özel et al. 2021 (Nature; FBrf0247762): single-cell 10x atlas of the
# Drosophila optic lobe through pupal development and in the adult (GEO GSE142787,
# 38 libraries; female Canton-S, 2 adult libraries pooled-sex). Previously loaded into
# VFB via the old FlyBase/SCEA mechanism as FBlc0005659 (SCEA E-CURD-134, 66 merged
# clusters); rebuilt here from GEO and the authors' own Seurat objects with fresh VFBseq
# ids. Curator decisions 2026-10-16: one Clustering per stage (P15, P30, P40, P50, P70,
# adult), one Cluster per final identity (the authors' adult cluster numbers, named
# in Supplementary Table 1); numbered clusters held (untyped) and low-quality (LQ)
# clusters held (artefact); numbered glia mapped to a glial anchor; less-confident
# names (*) mapped and flagged verification_needed. The per-stage unsupervised
# clusterings and the adult-male side analysis are not loaded (issue #21).
project: ozel_2021

source:
  doi: 10.1038/s41586-020-2879-3
  pmid: "33149298"
  pmcid: PMC7790857
  fbrf: FBrf0247762          # VFB production :pub node (resolved by PMID)
  title: "Neuronal diversity and convergence in a visual system developmental atlas"
  journal: Nature
  year: 2021
  first_author: Özel

organism: Drosophila melanogaster

dataset:
  site: GEO
  accession: GSE142787
  bioproject: PRJNA598342
  sra_study: SRP239181
  platform: GPL22106            # Illumina NextSeq 500 (the paper: NextSeq 550)
  licence: CC-BY-4.0
  assay_type: FBcv:0009000      # single-cell RNA-seq

sample_build:
  # GSM titles are "<stage>[_-]<library>_scRNAseq" (Adult1, Adult_1d_F_3rd, P70-5, ...).
  # Each GSM is one 10x library from its own dissection (paper: "15 libraries from adult
  # brains, 5 libraries each from P15, P30 and P70 brains and 4 libraries each from P40
  # and P50 brains", target 7,000 cells per experiment), so Sample:Assay 1:1.
  title_pattern: 'regex:(?P<timepoint>Adult|P\d+)[_-]?(?P<biorep>[^_-].*?)_scRNAseq'
  assay_method: { fbcv_id: FBcv:0009008, label: 10x sequencing }
  assay_label: { unit: 10x library }
  # Sex from GEO: female, except 2 adult libraries "pooled male and female" (left unset;
  # `mixed` suppresses the missing-sex warning for those). Flies: female Canton-S; no
  # stock number is given, so no FlyBase stock is linked.
  sex: mixed
  # GEO age -> FBdv. Pupal stages are % of pupal development at 25 C (paper: pupae
  # "selected at P0 (white pupae) and maintained at 25°C until the required stage"),
  # i.e. ~hours APF of the 100 h pupal period (FBdv: eclosion at 100 h APF), each
  # within one Bainbridge & Bownes stage by the FBdv definitions. Adults are "1-3 days
  # old" ("dissected within 3 days of eclosion"): all past tanning, so mature adult
  # stage, or the day the authors give in the GSM title (Adult_1d_* / Adult_3d_*; curator
  # 2026-10-16). Tissue: optic lobe, as for Kurmangaliyev 2020 — embryonic/larval optic lobe up
  # to the pupal stage (P5-P7), adult optic lobe from the pharate adult stage (P8).
  age_map:
    "P15%":
      stage:  { fbdv_id: FBdv:00005350, label: pupal stage P5 }          # 12.2-18.7 h APF
      tissue: { fbbt_id: FBbt:00001930, label: embryonic/larval optic lobe }
    "P30%":
      stage:  { fbdv_id: FBdv:00005353, label: pupal stage P6 }          # 18.7-32.4 h APF
      tissue: { fbbt_id: FBbt:00001930, label: embryonic/larval optic lobe }
    "P40%":
      stage:  { fbdv_id: FBdv:00005354, label: pupal stage P7 }          # 32.4-44.3 h APF
      tissue: { fbbt_id: FBbt:00001930, label: embryonic/larval optic lobe }
    "P50%":
      stage:  { fbdv_id: FBdv:00005355, label: pharate adult stage P8 }  # 44.3-56.6 h APF
      tissue: { fbbt_id: FBbt:00003701, label: adult optic lobe }
    "P70%":
      stage:  { fbdv_id: FBdv:00005356, label: pharate adult stage P9 }  # 56.6-74.5 h APF
      tissue: { fbbt_id: FBbt:00003701, label: adult optic lobe }
    "1-3 days old":
      stage:  { fbdv_id: FBdv:00007026, label: mature adult stage }
      tissue: { fbbt_id: FBbt:00003701, label: adult optic lobe }
  title_stages:
    - { pattern: '^Adult_1d_', stage: { fbdv_id: FBdv:00007076, label: day 1 of adulthood } }
    - { pattern: '^Adult_3d_', stage: { fbdv_id: FBdv:00007078, label: day 3 of adulthood } }
  # Sample labels: GEO's pupal tissue values repeat the stage ("P70 optic lobe", age
  # "P70%"), so the label shows the tissue as "optic lobe".
  tissue_labels:
    "P15 optic lobe": optic lobe
    "P30 optic lobe": optic lobe
    "P40 optic lobe": optic lobe
    "P50 optic lobe": optic lobe
    "P70 optic lobe": optic lobe
  # One Clustering per stage: the authors' final identities at that stage (Seurat
  # `FinalIdents`), linked to that stage's samples.
  clusterings:
    - { id: P15, name: "Özel 2021 P15 optic lobe identities", sample_age: "P15%" }
    - { id: P30, name: "Özel 2021 P30 optic lobe identities", sample_age: "P30%" }
    - { id: P40, name: "Özel 2021 P40 optic lobe identities", sample_age: "P40%" }
    - { id: P50, name: "Özel 2021 P50 optic lobe identities", sample_age: "P50%" }
    # the authors' P50-only split of T4/T5 (234, 235) into T4a-d / T5a-d (261-268)
    - { id: P50_T45, name: "Özel 2021 P50 T4/T5 subtypes", sample_age: "P50%" }
    - { id: P70, name: "Özel 2021 P70 optic lobe identities", sample_age: "P70%" }
    - { id: adult, name: "Özel 2021 adult optic lobe identities", sample_age: "1-3 days old" }

# Summary expression (scripts/build_expression.py) from the authors' raw UMI counts
# (RNA@counts of the Seurat objects, exported by export_seurat.R), as CPM over each
# cell's own counts: the adult matrix is the main part, each pupal stage an extra part
# (labels <stage>_<identity>). At P50 a T4/T5 cell is in its P50 identity and also in
# its subtype (memberships.tsv.gz, written by build_clusters.py). The objects carry
# gene symbols only, so the gene id map is keyed by symbol (looked up in FlyBase Chado).
expression:
  matrix_file: ozel/Adult/matrix.mtx.gz
  features_file: ozel/Adult/features.tsv.gz
  barcodes_file: ozel/Adult/barcodes.tsv.gz
  features_keyed_by: symbol
  extra_parts:
    - { matrix_file: ozel/P15/matrix.mtx.gz, features_file: ozel/P15/features.tsv.gz, barcodes_file: ozel/P15/barcodes.tsv.gz, metadata_file: ozel/P15/metadata.tsv.gz, label_prefix: P15_ }
    - { matrix_file: ozel/P30/matrix.mtx.gz, features_file: ozel/P30/features.tsv.gz, barcodes_file: ozel/P30/barcodes.tsv.gz, metadata_file: ozel/P30/metadata.tsv.gz, label_prefix: P30_ }
    - { matrix_file: ozel/P40/matrix.mtx.gz, features_file: ozel/P40/features.tsv.gz, barcodes_file: ozel/P40/barcodes.tsv.gz, metadata_file: ozel/P40/metadata.tsv.gz, label_prefix: P40_ }
    - { matrix_file: ozel/P50/matrix.mtx.gz, features_file: ozel/P50/features.tsv.gz, barcodes_file: ozel/P50/barcodes.tsv.gz, membership_file: ozel/P50/memberships.tsv.gz }
    - { matrix_file: ozel/P70/matrix.mtx.gz, features_file: ozel/P70/features.tsv.gz, barcodes_file: ozel/P70/barcodes.tsv.gz, metadata_file: ozel/P70/metadata.tsv.gz, label_prefix: P70_ }
  normalisation: CPM
  extent_cutoff: 0.2
  hide_in_terminfo: "true"
  gzip_tsv: true
  gene_id_map: gene_id_map.tsv
  # FBgn for a symbol from the source files of other projects (same-era references),
  # else by symbol in Chado
  gene_ids_from: [kurmangaliyev_2020, davie_2018, li_2022_fca_10x, lu_2023_afca]

# Clusters (projects/ozel_2021/build_clusters.py, from the R exports in .cache/ozel/):
# one entry per final identity per stage, named from Supplementary Table 1.
annotations:
  review_columns: [clustering, source_cluster_id, type, author_confidence, author_note]
  # cell -> identity for the expression build (the R exports, .cache/ozel/<stage>/)
  source_file: ozel/Adult/metadata.tsv.gz
  barcode_column: barcode
  label_column: FinalIdents
  label_prefix: adult_

# Numbered identities with a probable type in the authors' Supplementary Table 1
# comment (curator 2026-10-16: map them, unless the comment points to low quality):
# typed as given here, flagged author_confidence 'probable (author comment)'.
probable_identities:
  "93": { type: LC10c, basis: "likely to be LC10c (see main text)" }
  "98": { type: LC neuron, basis: "Very likely to be a LC cell: second best match for LC16." }
  "112": { type: Kenyon cell, basis: "best match for all kenyon cells ... could be contaminating kenyon cells from the central brain" }

# Held (listed in mapping.tsv, not loaded): identities the authors left numbered
# (untyped), low-quality identities (artefact) and identity 0, cells given no final
# identity (unassigned).
unidentified:
  rule: none
  hold_unidentified: true
  hold_reasons:
    "0": unassigned
    LQ: artefact
    G/LQ1: artefact
    G/LQ2: artefact
    G/LQ3: artefact
    G/LQ4: artefact
    G/LQ1 (in pupae): artefact
    G16/LQ: artefact

# FBbt mappings, once per author type, in two sets (curator 2026-10-16: immature terms
# up to the pupal stage, mature from the pharate adult stage): type_mapping/ for P50,
# P70, adult and P50_T45; type_mapping/immature/ for P15, P30, P40. Written by
# projects/ozel_2021/confirm_terms.py where no judgement is needed, else by
# map-clusters-to-fbbt agents from reports/; copied per cluster by
# scripts/expand_type_mappings.py.
type_mapping:
  clustering_dirs:
    P15: immature
    P30: immature
    P40: immature
