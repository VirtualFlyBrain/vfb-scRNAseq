name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"   # same interpreter the pipeline is developed on

      - name: Install locked environment
        run: uv sync --locked --extra dev

      - name: Tests
        run: uv run pytest

      - name: Validate project files (same rules as the Claude Code hooks)
        run: uv run python scripts/validate_project_files.py

      - name: mapping.tsv up to date with the mapping JSON
        run: uv run python scripts/check_mapping_tsv.py

      - name: expression/FBgn_list.txt up to date with the expression tables
        run: uv run python scripts/write_fbgn_list.py --check
