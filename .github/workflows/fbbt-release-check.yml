name: FBbt release check

# Weekly: if OLS has a newer FBbt release than the one recorded in
# checks/fbbt_last_checked.json, verify every project's FBbt terms against it
# (current, non-obsolete, label unchanged). On success the record is updated and
# committed; on failure the job fails and the record is left alone, so the next
# run re-checks. On a new release it also follows up the FBbt term requests in
# checks/pending_fbbt_requests.json: any whose FBbt issue was closed on or before
# the release date gets a reminder issue in this repo (clusters to re-map).

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Verify even if the FBbt release is unchanged"
        type: boolean
        default: false

permissions:
  contents: write   # to commit the updated record
  issues: write     # to open re-mapping reminders for released term requests

jobs:
  fbbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install locked environment
        run: uv sync --locked

      - name: Check for a new FBbt release and verify mappings
        id: fbbt
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_fbbt_release.py ${{ inputs.force && '--force' || '' }}

      - name: Commit the updated record / pending requests
        # also after a failed verification, so released term requests are not re-reported
        if: always() && steps.fbbt.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checks/
          git commit -m "FBbt release check: $(jq -r .version checks/fbbt_last_checked.json)"
          git push
