name: FBbt release check

# Weekly: if OLS has a newer FBbt release than the one recorded in
# checks/fbbt_last_checked.json, verify every project's FBbt terms against it
# (current, non-obsolete, label unchanged). On success the record is updated and
# committed; on failure the job fails and the record is left alone, so the next
# run re-checks.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Verify even if the FBbt release is unchanged"
        type: boolean
        default: false

permissions:
  contents: write   # to commit the updated record

jobs:
  fbbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install locked environment
        run: uv sync --locked

      - name: Check for a new FBbt release and verify mappings
        id: fbbt
        run: uv run python scripts/check_fbbt_release.py ${{ inputs.force && '--force' || '' }}

      - name: Commit the updated record
        if: steps.fbbt.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checks/fbbt_last_checked.json
          git commit -m "Record verified FBbt release $(jq -r .version checks/fbbt_last_checked.json)"
          git push
